[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenaudit"
version = "0.1.0"
description = "See where your AI tokens go across Claude Code, Codex, Gemini CLI and the OpenAI/Anthropic/Gemini SDKs, and whether they were worth it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Praveen Sattaru" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
keywords = ["llm", "tokens", "cost", "claude-code", "openai", "gemini", "anthropic", "finops"]

[project.urls]
Homepage = "https://github.com/sattaru/tokenaudit"
Issues = "https://github.com/sattaru/tokenaudit/issues"
Changelog = "https://github.com/sattaru/tokenaudit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest", "openai", "anthropic", "google-genai"]

[project.scripts]
tokenaudit = "tokenaudit.cli:main"

[tool.setuptools]
packages = ["tokenaudit"]

[tool.setuptools.package-data]
tokenaudit = ["prices_fallback.json"]
